[project]
name = "grae-3dmot"
version = "0.1.0"
description = "GRAE-3DMOT: Geometry Relation-Aware Encoder for Online 3D Multi-Object Tracking (self-contained, uv + CUDA 12.8 ready)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- core numerics / geometry (used by the self-contained ops & model) ---
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "pyquaternion>=0.9.9",
    "tqdm>=4.64",
    # --- runtime-enforced shape/type checking on the self-contained ops ---
    "jaxtyping>=0.2.34",
    "beartype>=0.18",
    # --- deep learning (CUDA 12.8 wheels resolved from the pytorch-cu128 index) ---
    "torch>=2.7,<2.9",
    "torchvision>=0.22,<0.24",
    # --- training / evaluation pipeline ---
    "fvcore>=0.1.5",
    "lapx>=0.5.11",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "tensorboard>=2.14",
]

# nuScenes data loading / official tracking evaluation pulls heavy, fragile
# transitive deps that are NOT required for the unit tests or GPU smoke tests.
# Install with `uv sync --extra nuscenes` when you actually need the dataset path.
[project.optional-dependencies]
nuscenes = [
    "nuscenes-devkit>=1.1.11",
    "motmetrics>=1.1.3,<1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ty>=0.0.1",
]

[tool.uv]
package = false
# This is a CUDA / Linux-only project; pin resolution to the wheel platform of
# this machine so the lockfile is deterministic (avoids resolving for unrelated
# platforms that have no cu128 wheels).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# PyTorch CUDA 12.8 wheels (required for Blackwell / sm_120 GPUs) live in a
# dedicated index. `explicit = true` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

# `ty` (Astral type checker) is scoped to the modules carrying real type hints;
# the legacy research code is intentionally left out so `uv run ty check` is
# actionable rather than drowning in pre-existing untyped-code noise.
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = [
    "ops",
    "utils/device.py",
    "utils/data_util.py",
    "scripts/check_environment.py",
]
